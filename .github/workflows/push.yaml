on:
  push: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # https://github.com/actions/runner-images/issues/10977#issuecomment-2810713336
      - run: |
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db
      - run: sudo apt-get update
      - run: sudo apt-get install -y qemu-system-x86 qemu-utils qemu-kvm
      - run: gpg --import --keyid-format LONG keys/Flatcar_Image_Signing_Key.asc
      - run: ./scripts/acquire.sh
      - run: ssh-keygen -C noreply@github.com -f "keys/id_ed25519" -N "" -t ed25519
      - run: sudo ./flatcar_production_qemu_uefi.sh -a keys/id_ed25519.pub -nographic &
      - run: ./scripts/wait_for_ssh.sh
        timeout-minutes: 1
      - run: ./scripts/ssh.sh hostname
      - run: |
          ./scripts/ssh.sh bash <<'EOF'
            docker run --rm python:3.12-slim python -c 'print("hello flatcar")'
          EOF
      - run: |
          ./scripts/ssh.sh bash << 'EOF'
          set -euo pipefail
          docker run -i --rm python:3.13 bash << 'EOT'
            set -euxo pipefail
            apt-get update && apt-get install -y libdw-dev libelf-dev pkg-config
            python -m pip install "pystack @ git+https://github.com/cakemanny/pystack.git@support-missing-process_vm_readv"
            python3 -c $'import time\nwhile True: time.sleep(1)' &
            target=$!
            sleep 0.3
            pystack remote $target
            pystack remote $target -vv 2>&1| grep falling
          EOT
          EOF
