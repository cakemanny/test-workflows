name: Test Action
description: A test action ${{ format('Hello {0} {1} {2}', 'Mona', 'the', 'Octocat') }}

inputs:
  a:
    description: A

runs:
  using: composite
  steps:
    - run: echo "runner.os=${{ runner.os }}"
      shell: sh
    - run: echo "job=${{ toJSON(job) }}"
      shell: sh
    - run: echo "runner=${{ toJSON(runner) }}"
      shell: sh
    - run: echo "env=${{ toJSON(env) }}"
      shell: sh
    - run: echo "strategy=${{ toJSON(strategy) }}"
      shell: sh
    - run: echo "matrix=${{ toJSON(matrix) }}"
      shell: sh
    - run: echo "inputs=${{ toJSON(inputs) }}"
      shell: sh
